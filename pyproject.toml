[project]
name = "mini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hongxu Xu", email = "h445xu@uwaterloo.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "mini-swe-agent>=2.4.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
mini = "mini:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["mini", "msaorch"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
# Exclude a specific package entirely from being installed
exclude-dependencies = [
    "pyarrow"
]
